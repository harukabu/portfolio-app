<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投資ダッシュボード</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--bg:#f4f6f9;
--card:#fff;
--text:#222;
--primary:#2563eb;
}

body.dark{
--bg:#0f172a;
--card:#1e293b;
--text:#fff;
}

body{
margin:0;
padding:16px;
font-family:sans-serif;
background:var(--bg);
color:var(--text);
}

.card{
background:var(--card);
padding:16px;
border-radius:12px;
margin-bottom:16px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:var(--primary);
color:white;
}

input{
width:100%;
padding:10px;
margin:4px 0 12px;
box-sizing:border-box;
}

.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.box{
padding:10px;
border-radius:10px;
background:rgba(37,99,235,.1);
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:8px;
border-bottom:1px solid #ddd;
}
</style>
</head>

<body>

<h1>📈 投資ダッシュボード</h1>

<button onclick="toggleDarkMode()">
🌙 ダークモード
</button>

<div class="card">

評価損益

</div>

</h3>
</div>

</div>
</div>

<div class="card">
<h2>📊 資産配分</h2>
<canvas id="chart"></canvas>
</div>

<div class="card">
<h2>🔥 買い増しライン</h2>

<input id="highPrice"
value="30000"
type="number">

<button onclick="calcBuyLine()">
計算
</button>

<div id="buyResult"></div>

</div>

<div class="card">

<input id="nisaLimit"
value="3600000">

</button>

</div>

<div class="card">

<h2>💰 配当利回り</h2>

<input
id="investAmount"
placeholder="投資額">

<input
id="dividendAmount"
placeholder="年間配当">

<button onclick="calcYield()">
計算
</button>

<div id="yieldResult"></div>

</div>

<div class="card">

<h2>📅 月別配当カレンダー</h2>

<table>

<tr><td>3月</td><td>22,900円</td></tr>
<tr><td>6月</td><td>3,500円</td></tr>
<tr><td>9月</td><td>22,900円</td></tr>
<tr><td>12月</td><td>3,500円</td></tr>

</table>

</div>
