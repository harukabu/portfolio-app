<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投資ダッシュボード</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  padding:20px;
  font-family:sans-serif;
  background:#f4f6f9;
}

.card{
  background:#fff;
  padding:15px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  margin-top:5px;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
  box-sizing:border-box;
}

a{
  word-break:break-all;
}
</style>

</head>
<body>

<div class="card">
<h3>🔗 よく使うURL</h3>

<p>
公開サイト<br>
<a href="https://harukabu.github.io/portfolio-app/" target="_blank">
https://harukabu.github.io/portfolio-app/
</a>
</p>

<p>
編集画面<br>
<a href="https://github.com/harukabu/portfolio-app" target="_blank">
https://github.com/harukabu/portfolio-app
</a>
</p>
</div>

<h1>📈 投資ダッシュボード</h1>

<div class="card">
<h2>📊 資産配分</h2>
<canvas id="chart"></canvas>
</div>

<div class="card">

<h2>📈 資産推移グラフ</h2>

<input type="month" id="assetMonth">

<input
type="number"
id="assetValue"
placeholder="総資産">

<button onclick="addAssetHistory()">
資産を追加
</button>

<button onclick="clearAssetHistory()">
🗑️ 資産履歴を削除
</button>

<canvas id="historyChart"></canvas>

</div>

<script>

// 資産配分グラフ
const chart = new Chart(
document.getElementById("chart"),
{
type:"pie",
data:{
labels:[
"米国株",
"日本株",
"投資信託",
"現金"
],
datasets:[{
data:[45,20,30,5]
}]
}
}
);

// 保存データ読込
const historyLabels =
JSON.parse(
localStorage.getItem("historyLabels")
) || [];

const historyValues =
JSON.parse(
localStorage.getItem("historyValues")
) || [];

// 資産推移グラフ
const historyChart =
new Chart(
document.getElementById("historyChart"),
{
type:"line",
data:{
labels:historyLabels,
datasets:[{
label:"総資産",
data:historyValues,
borderColor:"#2563eb",
backgroundColor:"rgba(37,99,235,.2)",
fill:true,
tension:0.3
}]
}
}
);

// 資産追加
function addAssetHistory(){

const month =
document.getElementById("assetMonth").value;

const asset =
Number(
document.getElementById("assetValue").value
);

if(!month || !asset){
alert("年月と総資産を入力してください");
return;
}

historyLabels.push(month);
historyValues.push(asset);

localStorage.setItem(
"historyLabels",
JSON.stringify(historyLabels)
);

localStorage.setItem(
"historyValues",
JSON.stringify(historyValues)
);

historyChart.update();
}

// 全削除
function clearAssetHistory(){

if(!confirm("資産履歴をすべて削除しますか？")){
return;
}

historyLabels.length = 0;
historyValues.length = 0;

localStorage.removeItem("historyLabels");
localStorage.removeItem("historyValues");

historyChart.data.labels = historyLabels;
historyChart.data.datasets[0].data = historyValues;

historyChart.update();

alert("削除しました");
}

</script>

</body>
</html>
